<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OAS Bay Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">
            OAS Bay
        </div>

        <h2>Technician Login</h2>

        <p class="subtitle">
            Access the service management system
        </p>


        <form method="POST" action="/login">


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input 
                class="form-control"
                name="username"
                placeholder="Enter username"
                pattern="[A-Za-z0-9 ]+"
                required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                class="form-control"
                type="password"
                name="password"
                placeholder="Enter password"
                maxlength="50"
                required>

            </div>


            <button class="btn login-btn w-100">
                Login
            </button>


        </form>


    </div>

</div>


</body>

</html>
